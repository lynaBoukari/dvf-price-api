[project]
name= "dvf-price-api"
version= "0.1.0"
description = "Estimation du prix d'un bien immobilier à partir des données DVF"
requires-python = ">=3.11"
dependencies =[
    "pandas>=2.2",
    "pyarrow >=16.0",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
]

[dependency-groups]
dev=[
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.0",
    "jupyter >=1.0",
    "matplotlib >=3.9",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
]

[build-system]
requires =["hatchling"]
build-backend ="hatchling.build"

[tool.hatch.build.targets.wheel]
packages =["src/dvf"]

[tool.ruff]
line-length =100
target-version ="py311"

[tool.ruff.lint]
select =["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version ="3.11"
strict = true

[tool.pytest.ini_options]
markers = ["lent: test qui prend plus d'une seconde (entraînement de modèle)"]
testpaths=["tests"]


# scikit-learn et joblib ne publient pas d'annotations de types.
# On déclare l'exception explicitement plutôt que de désactiver le mode strict.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true